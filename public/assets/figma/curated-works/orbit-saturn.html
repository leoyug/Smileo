:root { --color-bg: #050807; --color-title: #eafff0; --color-body: rgba(234, 255, 240, 0.6); --color-highlight: #3dff7a; --orbit-font: "Geist Pixel Line", "Geist Mono", monospace; --orbit-weight: 400; --orbit-tracking: 0em; --orbit-label-font: "Geist Mono", ui-monospace, monospace; }
:root { --font-heading: "Geist", system-ui, sans-serif; --font-mono: "Geist Mono", ui-monospace, monospace; }
html, body { margin: 0; height: 100%; color-scheme: only light; }
body { background: transparent; color: var(--color-title); }
:root[data-theme="light"] { --color-title: #242424; --color-body: rgba(36, 36, 36, 0.7); --color-highlight: #126044; }
.orbit-clock .orbit-lines { opacity: 0; transition: opacity 150ms cubic-bezier(.22, 1, .36, 1) 80ms; }

/* Orbit clock: shared by the demo page and the studio */

.orbit-clock {
  --orbit-fs: 12px;
  position: relative;
  width: 100%;
  height: 100%;
  min-height: 0;
}

.orbit-crt {
  position: absolute;
  inset: 0;
  z-index: 3;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.orbit-lines {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.orbit-sec {
  position: absolute;
  z-index: 2;
  left: 0;
  top: 0;
  font-family: var(--orbit-label-font, var(--font-mono));
  font-size: var(--orbit-fs);
  line-height: 1;
  letter-spacing: 0;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  color: var(--color-body);
  will-change: transform, opacity;
  pointer-events: none;
}

.orbit-center {
  --orbit-ls: var(--orbit-tracking, -0.01em);
  position: absolute;
  z-index: 1;
  left: 0;
  top: 0;
  font-family: var(--orbit-font, var(--font-heading));
  font-weight: var(--orbit-weight, 600);
  font-size: calc(44px * var(--orbit-scale, 1));
  line-height: 1.1;
  letter-spacing: var(--orbit-ls);
  color: var(--color-title);
  white-space: nowrap;
}

.orbit-clock.is-ready .orbit-center {
  transition: transform 0.9s cubic-bezier(0.65, 0, 0.35, 1);
}

.orbit-center[hidden] {
  display: none;
}

.orbit-ch {
  position: relative;
  display: inline-block;
  overflow: hidden;
  vertical-align: top;
  padding-bottom: 0.14em;
  margin-bottom: -0.14em;
}

.orbit-ch:last-child {
  margin-right: calc(-1 * var(--orbit-ls));
}

.orbit-ch.is-space,
.orbit-ch.is-colon {
  display: inline-flex;
  justify-content: center;
}

.orbit-ch.is-space {
  width: 0.2em;
}

.orbit-ch.is-colon {
  top: -0.11em;
  width: 0.32em;
}

.orbit-ch-in {
  display: inline-block;
  will-change: transform;
}

.orbit-ch-in.is-old {
  position: absolute;
  left: 0;
  top: 0;
}

@media (prefers-reduced-motion: reduce) {
  .orbit-clock.is-ready .orbit-center {
    transition: none;
  }
}

<body>
<div id="clock"></div>
<script type="module">
// Orbit clock engine.
// Every elapsed second of the current minute is a label tied to a hair-thin
// "string" that sways with wind, inertia and the mouse. At the end of each
// minute the labels collapse and a new minute starts growing.
// A "form" decides where labels live (ring, dial, spiral, chimes, stars);
// timing, physics and rendering are shared by all forms.

const SECONDS = 60;
const DEG_PER_SECOND = 360 / SECONDS;

// Per-second rotation: an eased step instead of a linear sweep.
const TICK_PHASE = 0.6;
const TICK_LINEAR_MIX = 0.08;

// Newest label: flies in from beyond its home and cools from accent to body color.
const ENTER = { duration: 0.45, overshoot: 0.254, fadeIn: 0.1, colorFrom: 0.1, colorTo: 0.28 };

// Minute collapse: labels fall into their target one by one in a shuffled order.
const COLLAPSE = { start: 59.1, stagger: 1 / 60, duration: 0.5, fadeBand: 0.3, introDelay: 0.15 };
const FALL_TIME_SCALE = 0.855;
const MAX_BLUR = 1.5;
// How long into a new minute the previous minute may still be collapsing.
const COLLAPSE_TAIL = COLLAPSE.start + (SECONDS - 1) * COLLAPSE.stagger + COLLAPSE.duration - SECONDS;

const STRING = {
  gap: 6,
  damping: 14,
  inertia: 1.2,
  pluck: 260,
  mouseRadius: 250,
  pulseWidth: 0.3,
  pulseAlpha: 0.8,
  maxBend: 60,
};

const LABEL = { maxSize: 12, minSize: 10, gapX: 0.8, height: 1.2, width: 0.7, ringPad: 4 };
const READOUT_SIZE = 44;

const DIGIT_MOTION = { duration: 620, easing: "cubic-bezier(0.16, 1, 0.3, 1)" };
const DIGIT_STAGGER_MS = 50;
const digitEase = cubicBezier(0.16, 1, 0.3, 1);
// Separator widths in em; the DOM readout uses the same values in CSS.
const SEPARATOR_EM = { ":": 0.32, "\u00a0": 0.2 };
const MORPH_MS = 900;

const clamp = (x, min, max) => Math.min(max, Math.max(min, x));
const clamp01 = (x) => clamp(x, 0, 1);
const smoothstep = (edge0, edge1, x) => {
  const t = clamp01((x - edge0) / (edge1 - edge0));
  return t * t * (3 - 2 * t);
};
const easeOutQuart = (t) => 1 - (1 - t) ** 4;
const easeInOutCubic = (t) => (t < 0.5 ? 4 * t ** 3 : 1 - (-2 * t + 2) ** 3 / 2);
const pad2 = (n) => String(n).padStart(2, "0");

// CSS-style cubic-bezier(x1, y1, x2, y2) easing, solved for x with Newton steps.
function cubicBezier(x1, y1, x2, y2) {
  const curve = (a, b, t) => 3 * a * (1 - t) ** 2 * t + 3 * b * (1 - t) * t * t + t ** 3;
  const slope = (a, b, t) => 3 * a * (1 - t) ** 2 + 6 * (b - a) * (1 - t) * t + 3 * (1 - b) * t * t;
  return (x) => {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 8; i++) {
      const d = slope(x1, x2, t);
      if (Math.abs(d) < 1e-6) break;
      t = Math.min(1, Math.max(0, t - (curve(x1, x2, t) - x) / d));
    }
    return curve(y1, y2, t);
  };
}
const mix = (a, b, t) => a + (b - a) * t;
const mixPoint = (a, b, t) => ({ x: mix(a.x, b.x, t), y: mix(a.y, b.y, t) });
const lerpColor = (from, to, t) => from.map((v, i) => mix(v, to[i], t));
const toRgba = ([r, g, b], alpha) =>
  `rgba(${Math.round(r)}, ${Math.round(g)}, ${Math.round(b)}, ${alpha.toFixed(3)})`;

// Continuous time -> stepped "clock time" used for rotation.
function tickTime(seconds) {
  const shifted = seconds + TICK_PHASE;
  const whole = Math.floor(shifted);
  const t = shifted - whole;
  return whole + (1 - TICK_LINEAR_MIX) * easeInOutCubic(t ** 1.25) + TICK_LINEAR_MIX * t;
}

// Distance factor while falling into the target (quadratic, gravity-like).
function fallRadius(progress) {
  const t = progress * FALL_TIME_SCALE;
  return Math.max(0, 1 - 0.088 * t - 1.262 * t * t);
}
function fallSpeed(progress) {
  return (0.088 + 2.524 * progress * FALL_TIME_SCALE) * FALL_TIME_SCALE;
}
const motionBlur = (progress) => MAX_BLUR * Math.min(1, fallSpeed(progress) / COLLAPSE.duration / 3);

// mulberry32: small deterministic PRNG so a minute always behaves the same.
function seededRandom(seed) {
  let s = seed | 0;
  return () => {
    s = (s + 0x6d2b79f5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Random rank for each index; `weight` < 1 pulls an index towards the front.
function shuffledRanks(count, random, weight = () => 1) {
  const keyed = Array.from({ length: count }, (_, index) => ({ index, key: random() * weight(index) }));
  keyed.sort((a, b) => a.key - b.key);
  const ranks = new Array(count);
  keyed.forEach(({ index }, rank) => (ranks[index] = rank));
  return ranks;
}

function parseColor(value) {
  const hex = value.trim().match(/^#([\da-f]{3}|[\da-f]{6})$/i)?.[1];
  if (hex) {
    const full = hex.length === 3 ? [...hex].map((c) => c + c).join("") : hex;
    return [0, 2, 4].map((i) => parseInt(full.slice(i, i + 2), 16)).concat(1);
  }
  const rgb = value.match(/rgba?\(\s*([\d.]+)[,\s]+([\d.]+)[,\s]+([\d.]+)(?:[,\s/]+([\d.]+))?/i);
  return rgb ? [+rgb[1], +rgb[2], +rgb[3], rgb[4] === undefined ? 1 : +rgb[4]] : null;
}

/* ------------------------------------------------------------------ */
/* Forms                                                                */
/* ------------------------------------------------------------------ */

const polar = (g, radius, deg) => {
  const a = (deg * Math.PI) / 180;
  return { x: g.cx + Math.cos(a) * radius, y: g.cy - Math.sin(a) * radius };
};
const centerReadout = (g) => ({ x: g.cx, y: g.cy });

// Best-candidate sampling keeps stars evenly spread without a grid look.
function makeStars(seed, innerRadius) {
  const random = seededRandom(seed);
  const stars = [];
  for (let i = 0; i < SECONDS; i++) {
    let best = null;
    let bestDistance = -1;
    for (let k = 0; k < 16; k++) {
      const r = Math.sqrt(innerRadius ** 2 + (1 - innerRadius ** 2) * random());
      const angle = random() * 360;
      const x = Math.cos((angle * Math.PI) / 180) * r;
      const y = Math.sin((angle * Math.PI) / 180) * r;
      let nearest = Infinity;
      for (const s of stars) nearest = Math.min(nearest, (s.x - x) ** 2 + (s.y - y) ** 2);
      if (nearest > bestDistance) {
        bestDistance = nearest;
        best = { r, angle, x, y };
      }
    }
    stars.push(best);
  }
  return stars;
}

// Faint dots on positions whose second has not arrived yet.
function upcomingDots(position) {
  return (ctx, g, color) => {
    ctx.fillStyle = color;
    for (let s = g.secondOfMinute + 1; s < SECONDS; s++) {
      const p = position(g, s);
      ctx.beginPath();
      ctx.arc(p.x, p.y, 1, 0, Math.PI * 2);
      ctx.fill();
    }
  };
}

const dialPoint = (g, second) => polar(g, g.radius, 90 - DEG_PER_SECOND * second);
const DIAL_TICK_START = 0.8;

// Square clock face: walk the perimeter clockwise from top-center.
function framePoint(g, second) {
  const half = g.radius * 0.72;
  const d = (second / SECONDS) * 8;
  let x;
  let y;
  if (d < 1) [x, y] = [d, -1];
  else if (d < 3) [x, y] = [1, d - 2];
  else if (d < 5) [x, y] = [4 - d, 1];
  else if (d < 7) [x, y] = [-1, 6 - d];
  else [x, y] = [d - 8, -1];
  return { x: g.cx + x * half, y: g.cy + y * half };
}

// 12 x 6 grid with a 6 x 2 hole for the readout leaves exactly 60 cells.
const GRID = { cols: 12, rows: 6, holeCols: [3, 8], holeRows: [2, 3] };
const GRID_CELLS = [];
for (let row = 0; row < GRID.rows; row++) {
  for (let col = 0; col < GRID.cols; col++) {
    const inHole =
      col >= GRID.holeCols[0] && col <= GRID.holeCols[1] && row >= GRID.holeRows[0] && row <= GRID.holeRows[1];
    if (!inHole) GRID_CELLS.push({ col, row });
  }
}
function gridPoint(g, second) {
  const cell = (g.radius * 2) / GRID.cols;
  const { col, row } = GRID_CELLS[second];
  return {
    x: g.cx + (col - (GRID.cols - 1) / 2) * cell,
    y: g.cy + (row - (GRID.rows - 1) / 2) * cell,
  };
}

// Readout sits on the rail like a shelf; seconds hang below in four staggered rows.
const CHIME_ROWS = [0, 2, 1, 3];
function chimeRail(g) {
  const span = Math.max(0, Math.min(g.radius * 2, g.width - g.labelSize * 6));
  return { x0: g.cx - span / 2, span, y: g.cy - g.radius * 0.2 };
}

// Tilted ring seen in perspective; the lower half is the near side.
const SATURN_TILT = (-10 * Math.PI) / 180;
const SATURN_FLATTEN = 0.5;

const FORMS = {
  orbit: {
    label: "Orbit",
    readout: centerReadout,
    place(g, item) {
      return { home: polar(g, g.radius, 180 - DEG_PER_SECOND * item.age), anchor: g.center, target: g.center };
    },
  },
  dial: {
    label: "Dial",
    readout: centerReadout,
    // Only the newest second is a full "hand" from the center. As the next
    // second arrives its root slides out to the rim, leaving a short tick.
    place(g, item) {
      const deg = 90 - DEG_PER_SECOND * item.second;
      const settled = smoothstep(0, 1, item.age);
      const major = item.second % 5 === 0;
      return {
        home: dialPoint(g, item.second),
        anchor: polar(g, g.radius * DIAL_TICK_START * settled, deg),
        target: g.center,
        depth: Math.max(major ? 1 : 0.45, 1 - settled),
        slack: mix(1, 0.15, settled),
      };
    },
    backdrop: upcomingDots(dialPoint),
  },
  frame: {
    label: "Frame",
    readout: centerReadout,
    place(g, item) {
      return { home: framePoint(g, item.second), anchor: g.center, target: g.center };
    },
    backdrop: upcomingDots(framePoint),
  },
  grid: {
    label: "Grid",
    readout: centerReadout,
    place(g, item) {
      return { home: gridPoint(g, item.second), anchor: g.center, target: g.center };
    },
    backdrop: upcomingDots(gridPoint),
  },
  bloom: {
    label: "Bloom",
    readout: centerReadout,
    // Five fixed petals; labels breathe in and out as they rotate through them.
    place(g, item) {
      const deg = 180 - DEG_PER_SECOND * item.age;
      const petal = Math.cos(5 * (((deg - 90) * Math.PI) / 180));
      return { home: polar(g, g.radius * (0.8 + 0.2 * petal), deg), anchor: g.center, target: g.center };
    },
  },
  spiral: {
    label: "Spiral",
    readout: centerReadout,
    place(g, item) {
      const drift = clamp01(item.age / (SECONDS - 1));
      return {
        home: polar(g, g.radius * (0.5 + 0.5 * drift), 180 - 9 * item.age),
        anchor: g.center,
        target: g.center,
      };
    },
  },
  saturn: {
    label: "Saturn",
    readout: centerReadout,
    place(g, item) {
      // Newest second enters at the front, then circles behind the readout.
      const phi = ((90 + DEG_PER_SECOND * item.age) * Math.PI) / 180;
      const x = Math.cos(phi) * g.radius;
      const y = Math.sin(phi) * g.radius * SATURN_FLATTEN;
      return {
        home: {
          x: g.cx + x * Math.cos(SATURN_TILT) - y * Math.sin(SATURN_TILT),
          y: g.cy + x * Math.sin(SATURN_TILT) + y * Math.cos(SATURN_TILT),
        },
        anchor: g.center,
        target: g.center,
        depth: (Math.sin(phi) + 1) / 2,
      };
    },
  },
  chimes: {
    label: "Chimes",
    readout: (g) => ({ x: g.cx, y: chimeRail(g).y - g.readoutSize * 0.72 }),
    fadeIntoReadout: false,
    place(g, item) {
      const rail = chimeRail(g);
      const x = rail.x0 + (rail.span * item.age) / (SECONDS - 1);
      const length = g.radius * (0.2 + 0.14 * CHIME_ROWS[item.second % 4]);
      const anchor = { x, y: rail.y };
      return { home: { x, y: rail.y + length }, anchor, target: anchor };
    },
    backdrop(ctx, g, color) {
      const rail = chimeRail(g);
      ctx.strokeStyle = color;
      ctx.beginPath();
      ctx.moveTo(rail.x0 - g.labelSize, rail.y);
      ctx.lineTo(rail.x0 + rail.span + g.labelSize, rail.y);
      ctx.stroke();
    },
  },
  constellation: {
    label: "Stars",
    readout: centerReadout,
    padAnchor: true,
    place(g, item) {
      const star = g.stars(item.minute)[item.second];
      return {
        home: polar(g, g.radius * star.r, star.angle - item.spin * 0.5),
        anchor: item.prev ?? g.center,
        target: g.center,
      };
    },
  },
};

const DEFAULT_OPTIONS = Object.freeze({
  form: "orbit",
  scale: 1,
  hour12: false,
  readout: true,
  labels: true,
  strings: true,
  tick: "eased",
  collapse: true,
  motionBlur: true,
  pulse: true,
  pulseSpeed: 0.8,
  wind: 18,
  mouseForce: 2400,
  stiffness: 140,
  stringWidth: 0.5,
});

const TICK_STYLES = ["eased", "smooth", "step"];

/* ------------------------------------------------------------------ */
/* Center readout: per-character masked slide transitions              */
/* ------------------------------------------------------------------ */

function createReadout(container, reducedMotion) {
  const slots = [];
  let started = false;

  const makeGlyph = (ch) => {
    const glyph = document.createElement("span");
    glyph.className = "orbit-ch-in";
    glyph.textContent = ch;
    return glyph;
  };

  function build(text, hidden) {
    container.textContent = "";
    slots.length = 0;
    for (const ch of text) {
      const mask = document.createElement("span");
      // Separator slots get fixed widths in CSS so every typeface spaces the time the same way.
      if (ch === ":") mask.className = "orbit-ch is-colon";
      else if (ch === "\u00a0") mask.className = "orbit-ch is-space";
      else mask.className = "orbit-ch";
      const glyph = makeGlyph(ch);
      if (hidden) glyph.style.transform = "translateY(120%)";
      mask.appendChild(glyph);
      container.appendChild(mask);
      slots.push({ mask, glyph, ch });
    }
  }

  function update(text) {
    if (slots.length !== text.length || reducedMotion || !started) {
      build(text, !reducedMotion && !started);
      return;
    }
    let changed = 0;
    [...text].forEach((ch, i) => {
      const slot = slots[i];
      if (slot.ch === ch) return;
      const delay = changed++ * DIGIT_STAGGER_MS;
      const outgoing = slot.glyph;
      outgoing.classList.add("is-old");
      outgoing
        .animate([{ transform: "translateY(0)" }, { transform: "translateY(-120%)" }], {
          ...DIGIT_MOTION,
          delay,
          fill: "forwards",
        })
        .finished.finally(() => outgoing.remove());
      const incoming = makeGlyph(ch);
      slot.mask.appendChild(incoming);
      incoming.animate([{ transform: "translateY(120%)" }, { transform: "translateY(0)" }], {
        ...DIGIT_MOTION,
        delay,
        fill: "backwards",
      });
      slot.glyph = incoming;
      slot.ch = ch;
    });
  }

  function reveal(animateIntro = true) {
    started = true;
    slots.forEach(({ glyph }, i) => {
      glyph.style.transform = "";
      if (!animateIntro) return;
      glyph.animate([{ transform: "translateY(120%)" }, { transform: "translateY(0)" }], {
        ...DIGIT_MOTION,
        delay: i * DIGIT_STAGGER_MS,
        fill: "backwards",
      });
    });
  }

  function hide(text) {
    started = false;
    build(text, !reducedMotion);
  }

  return { build, update, reveal, hide };
}

/* ------------------------------------------------------------------ */
/* Canvas readout: the same per-character roll, drawn with fillText     */
/* ------------------------------------------------------------------ */

function createCanvasReadout(reducedMotion) {
  let slots = [];
  let revealed = false;
  let revealAt = 0;

  function build(text, hidden) {
    slots = [...text].map((ch) => ({ ch, prev: null, changedAt: 0, delay: 0 }));
    revealed = !hidden;
    revealAt = 0;
  }

  function update(text) {
    if (slots.length !== text.length || reducedMotion || !revealed) {
      build(text, !reducedMotion && !revealed);
      return;
    }
    const nowMs = performance.now();
    let changed = 0;
    [...text].forEach((ch, i) => {
      const slot = slots[i];
      if (slot.ch === ch) return;
      slot.prev = slot.ch;
      slot.ch = ch;
      slot.changedAt = nowMs;
      slot.delay = changed++ * DIGIT_STAGGER_MS;
    });
  }

  function reveal(animateIntro = true) {
    revealed = true;
    revealAt = animateIntro ? performance.now() : 0;
  }

  function hide(text) {
    revealed = false;
    build(text, true);
  }

  // Draws centred on (x, y) and returns the width, mirroring the DOM masks:
  // each character is clipped to its slot and slides by 120% of the line box.
  function draw(ctx, x, y, { font, size, tracking, ink }) {
    ctx.save();
    ctx.font = font;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = ink;
    const trackPx = tracking * size;
    const widths = slots.map((slot) =>
      slot.ch in SEPARATOR_EM ? SEPARATOR_EM[slot.ch] * size : ctx.measureText(slot.ch).width + trackPx,
    );
    const total = widths.reduce((sum, w) => sum + w, 0) - trackPx;
    const lineHeight = size * 1.1;
    const travel = lineHeight * 1.2;
    const nowMs = performance.now();

    let cursor = x - total / 2;
    slots.forEach((slot, i) => {
      const w = widths[i];
      const isSeparator = slot.ch in SEPARATOR_EM;
      const cx = cursor + (isSeparator ? w : w - trackPx) / 2;
      const cy = y + (slot.ch === ":" ? -0.11 * size : 0);
      ctx.save();
      ctx.beginPath();
      ctx.rect(cursor, cy - lineHeight / 2, w, lineHeight + 0.14 * size);
      ctx.clip();

      let shown = revealed ? 1 : 0;
      if (revealed && revealAt) shown = digitEase((nowMs - revealAt - i * DIGIT_STAGGER_MS) / DIGIT_MOTION.duration);
      if (slot.prev !== null) {
        const p = digitEase((nowMs - slot.changedAt - slot.delay) / DIGIT_MOTION.duration);
        if (p >= 1) slot.prev = null;
        else ctx.fillText(slot.prev, cx, cy - travel * p);
        ctx.fillText(slot.ch, cx, cy + travel * (1 - p));
      } else {
        ctx.fillText(slot.ch, cx, cy + travel * (1 - shown));
      }
      ctx.restore();
      cursor += w;
    });
    ctx.restore();
    return total;
  }

  return { build, update, reveal, hide, draw };
}

function sanitizeOptions(input) {
  const o = { ...DEFAULT_OPTIONS, ...input };
  if (!(o.form in FORMS)) o.form = DEFAULT_OPTIONS.form;
  if (!TICK_STYLES.includes(o.tick)) o.tick = DEFAULT_OPTIONS.tick;
  o.scale = clamp(Number(o.scale) || 1, 0.4, 3);
  return o;
}

/* ------------------------------------------------------------------ */
/* Clock                                                                */
/* ------------------------------------------------------------------ */

function mountOrbitClock(root, initialOptions = {}) {
  const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let options = sanitizeOptions(initialOptions);

  root.classList.add("orbit-clock");
  root.setAttribute("aria-hidden", "true");

  const canvas = document.createElement("canvas");
  canvas.className = "orbit-lines";
  const ctx = canvas.getContext("2d");
  const center = document.createElement("div");
  center.className = "orbit-center";
  root.append(canvas, center);

  // A post-process pass (e.g. a retro screen) needs every pixel in one canvas,
  // so while one is attached the labels and readout are drawn on the canvas too.
  let post = null;
  const palette = { accent: [255, 86, 16, 1], body: [26, 9, 2, 0.6], bg: [7, 7, 7, 1], title: [254, 243, 238, 1] };
  // Typeface and ink for the canvas renderer, read from the same CSS variables the DOM uses.
  const textStyle = { family: "system-ui, sans-serif", weight: "600", tracking: -0.01, labelFamily: "monospace", ink: "#fff" };
  function readPalette() {
    const style = getComputedStyle(root);
    const prop = (name) => style.getPropertyValue(name).trim();
    palette.accent = parseColor(prop("--color-highlight")) ?? palette.accent;
    palette.body = parseColor(prop("--color-body")) ?? palette.body;
    palette.bg = parseColor(prop("--color-bg")) ?? palette.bg;
    palette.title = parseColor(prop("--color-title")) ?? palette.title;
    textStyle.family = prop("--orbit-font") || prop("--font-heading") || textStyle.family;
    textStyle.weight = prop("--orbit-weight") || "600";
    const tracking = prop("--orbit-tracking");
    textStyle.tracking = tracking ? parseFloat(tracking) : -0.01;
    textStyle.labelFamily = prop("--orbit-label-font") || prop("--font-mono") || "monospace";
    textStyle.ink = prop("--color-title") || textStyle.ink;
    // Post passes take their colours from the current palette and theme.
    post?.setColors?.({ bg: palette.bg, ink: palette.title, accent: palette.accent });
  }
  readPalette();

  // Geometry (CSS px)
  let width = 0;
  let height = 0;
  let radius = 0;
  let labelSize = LABEL.maxSize;
  let stringGap = STRING.gap;
  let dpr = 1;
  let rootRect = root.getBoundingClientRect();
  let readoutHalfWidth = 0;
  let readoutTransform = "";
  let canvasReadoutWidth = 0;

  function measureReadout() {
    if (!options.readout) readoutHalfWidth = 0;
    else readoutHalfWidth = (post ? canvasReadoutWidth : center.offsetWidth) / 2;
  }

  function measure() {
    const { scale } = options;
    root.style.setProperty("--orbit-scale", String(scale));
    center.hidden = !options.readout || Boolean(post);

    const rect = root.getBoundingClientRect();
    width = rect.width;
    height = rect.height;
    if (width < 2 || height < 2) return;

    const maxLabel = LABEL.maxSize * scale;
    const ringPad = LABEL.ringPad * scale;
    const half = Math.min(width, height) / 2;
    let ring = half * 0.92 * 0.64;
    for (let i = 0; i < 2; i++) {
      const tick = Math.max(10, ring * 0.038) * 1.2;
      const outer = ring * 1.01 + ringPad + tick + 1;
      if (outer > half) ring *= half / outer;
    }
    const minRadius = ring * 1.01 + ringPad + (maxLabel * LABEL.height) / 2;
    const halfStep = Math.sin(Math.PI / SECONDS);
    const labelDiag = Math.hypot(LABEL.height, LABEL.width);
    // Radius at which neighbouring labels of `fontSize` keep `gap` px apart.
    const radiusToFit = (fontSize, gap) => (labelDiag * fontSize + gap) / (2 * halfStep);
    const maxRadius = half - (maxLabel * LABEL.height) / 2;

    radius = Math.min(maxRadius, Math.max(minRadius, radiusToFit(maxLabel, 5 * scale)));
    labelSize = clamp((2 * radius * halfStep) / (labelDiag + LABEL.gapX), LABEL.minSize * scale, maxLabel);
    stringGap = STRING.gap * scale;
    root.style.setProperty("--orbit-fs", `${labelSize}px`);

    // The post pass upscales and pixelates anyway, so its source canvas stays at 1x.
    dpr = post ? 1 : Math.min(2, devicePixelRatio || 1);
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    post?.resize(width, height);
    rootRect = root.getBoundingClientRect();
    measureReadout();
  }

  // Second labels, keyed by absolute unix second
  const labels = new Map();
  function labelFor(absSecond) {
    let label = labels.get(absSecond);
    if (!label) {
      const el = document.createElement("span");
      el.className = "orbit-sec";
      root.appendChild(el);
      label = { el, text: "", opacity: -1, blur: -1, color: "", layer: "" };
      labels.set(absSecond, label);
    }
    return label;
  }

  // Collapse order per minute (first two seconds tend to fall first)
  const collapseOrders = new Map();
  function collapseOrder(minuteStart) {
    let order = collapseOrders.get(minuteStart);
    if (!order) {
      order = shuffledRanks(SECONDS, seededRandom(minuteStart), (i) => (i < 2 ? 0.25 : 1));
      collapseOrders.set(minuteStart, order);
      if (collapseOrders.size > 3) collapseOrders.delete(collapseOrders.keys().next().value);
    }
    return order;
  }

  // Star layouts per minute, normalized to the ring radius
  const starCache = new Map();
  function starsFor(minuteStart) {
    const inner = clamp((READOUT_SIZE * options.scale * 1.6 + 12) / Math.max(1, radius), 0.3, 0.75);
    const key = `${minuteStart}:${inner.toFixed(2)}`;
    let stars = starCache.get(key);
    if (!stars) {
      stars = makeStars(minuteStart, inner);
      starCache.set(key, stars);
      if (starCache.size > 4) starCache.delete(starCache.keys().next().value);
    }
    return stars;
  }

  const formatTime = (date) => {
    const h = date.getHours();
    const hours = options.hour12 ? h % 12 || 12 : h;
    return `${pad2(hours)} : ${pad2(date.getMinutes())}`;
  };

  const readout = createReadout(center, reducedMotion);
  const canvasReadout = createCanvasReadout(reducedMotion);
  let shownTime = formatTime(new Date());
  readout.build(shownTime, !reducedMotion);
  canvasReadout.build(shownTime, !reducedMotion);

  let started = false;
  let intro = null;

  function start(animateIntro = true) {
    if (started) return;
    started = true;
    if (!reducedMotion) {
      readout.reveal(animateIntro);
      canvasReadout.reveal(animateIntro);
    }
    if (reducedMotion || !animateIntro) {
      measure();
      frame();
      return;
    }
    const now = Date.now() / 1000;
    const minuteStart = Math.floor(now / 60) * 60;
    const lastSecond = Math.floor(now) - minuteStart;
    intro = {
      at: now,
      minuteStart,
      lastSecond,
      order: shuffledRanks(lastSecond + 1, seededRandom((Math.random() * 2 ** 31) | 0)),
    };
  }

  function replay() {
    started = false;
    intro = null;
    readout.hide(shownTime);
    canvasReadout.hide(shownTime);
    requestAnimationFrame(start);
  }

  // Form morphing: placements blend from the previous form for MORPH_MS.
  let morph = null;
  function placeItem(g, item) {
    const next = FORMS[options.form].place(g, item);
    if (!morph) return next;
    const from = FORMS[morph.from].place(g, item);
    const t = morph.t;
    return {
      home: mixPoint(from.home, next.home, t),
      anchor: mixPoint(from.anchor, next.anchor, t),
      target: mixPoint(from.target, next.target, t),
      depth: mix(from.depth ?? 1, next.depth ?? 1, t),
      slack: mix(from.slack ?? 1, next.slack ?? 1, t),
    };
  }

  // Per-string spring state, keyed by absolute second
  const strings = new Map();
  const pointer = { x: -1e4, y: -1e4, vx: 0, vy: 0, active: false };
  let lastFrameAt = 0;

  function frame() {
    if (width < 2 || height < 2) return;

    const now = Date.now() / 1000;
    const wholeSecond = Math.floor(now);
    const secondFrac = now - wholeSecond;
    const minuteStart = Math.floor(now / 60) * 60;
    const secondOfMinute = wholeSecond - minuteStart;
    const sinceMinute = now - minuteStart;
    let spin = tickTime(now);
    if (reducedMotion || options.tick === "step") spin = wholeSecond + 1;
    else if (options.tick === "smooth") spin = now + TICK_PHASE;

    if (morph) {
      const p = (performance.now() - morph.at) / MORPH_MS;
      if (p >= 1) morph = null;
      else morph.t = easeInOutCubic(clamp01(p));
    }

    const form = FORMS[options.form];
    const g = {
      cx: width / 2,
      cy: height / 2,
      center: { x: width / 2, y: height / 2 },
      width,
      height,
      radius,
      labelSize,
      readoutSize: READOUT_SIZE * options.scale,
      secondOfMinute,
      stars: starsFor,
    };

    const readoutAt = form.readout(g);
    const transform = `translate3d(${readoutAt.x.toFixed(1)}px, ${readoutAt.y.toFixed(1)}px, 0) translate(-50%, -50%)`;
    if (transform !== readoutTransform) {
      center.style.transform = transform;
      readoutTransform = transform;
    }

    const time = formatTime(new Date(wholeSecond * 1000));
    if (time !== shownTime) {
      readout.update(time);
      canvasReadout.update(time);
      shownTime = time;
      measureReadout();
    }

    // The DOM readout eases between forms with a CSS transition; the canvas one follows the morph.
    const readoutPoint = morph ? mixPoint(FORMS[morph.from].readout(g), readoutAt, morph.t) : readoutAt;

    const visible = new Set();
    const lines = [];
    const textItems = [];
    const labelPad = (labelSize * LABEL.height) / 2 + stringGap;

    if (started) {
      const minutes = [];
      const previousStillFalling =
        !reducedMotion && sinceMinute < COLLAPSE_TAIL && (!intro || minuteStart - 60 >= intro.minuteStart);
      if (previousStillFalling) minutes.push({ start: minuteStart - 60, last: SECONDS - 1 });
      minutes.push({ start: minuteStart, last: secondOfMinute });

      for (const minute of minutes) {
        let prev = null;
        for (let s = 0; s <= minute.last; s++) {
          const absSecond = minute.start + s;
          const age = spin - (absSecond + 1);
          const { home, anchor, target, depth = 1, slack = 1 } = placeItem(g, {
            second: s,
            absSecond,
            minute: minute.start,
            age,
            spin,
            prev,
          });

          const homeDistance = Math.max(1, Math.hypot(home.x - target.x, home.y - target.y));
          const fadeStart =
            form.fadeIntoReadout === false ? 0.15 : Math.min(0.6, (readoutHalfWidth + 8) / homeDistance);

          let reach = 1; // 1 = at home, 0 = at the collapse target
          let opacity = 1;
          let blur = 0;
          let color = "";
          let entering = false;
          let growth = 1;

          if (!reducedMotion) {
            if (minute.last === SECONDS - 1) {
              const at = minute.start + COLLAPSE.start + collapseOrder(minute.start)[s] * COLLAPSE.stagger;
              const p = (now - at) / COLLAPSE.duration;
              if (p > 0) {
                if (p >= 1) continue;
                if (options.collapse) {
                  reach = fallRadius(p);
                  opacity = smoothstep(fadeStart, fadeStart + COLLAPSE.fadeBand, reach);
                  blur = motionBlur(p);
                } else {
                  opacity = 1 - smoothstep(0, 1, p);
                }
              }
            }

            let rising = false;
            if (intro && minute.start === intro.minuteStart && s <= intro.lastSecond) {
              const at = intro.at + COLLAPSE.introDelay + intro.order[s] * COLLAPSE.stagger;
              const p = (now - at) / COLLAPSE.duration;
              if (p < 1) {
                rising = true;
                const reverse = 1 - Math.max(0, p);
                reach = fallRadius(reverse);
                opacity = p <= 0 ? 0 : smoothstep(fadeStart, fadeStart + COLLAPSE.fadeBand, reach);
                blur = motionBlur(reverse);
              }
            }

            if (!rising && minute.start === minuteStart && s === secondOfMinute && secondFrac < ENTER.duration) {
              const e = easeOutQuart(secondFrac / ENTER.duration);
              reach = 1 + ENTER.overshoot * (1 - e);
              opacity = smoothstep(0, ENTER.fadeIn, secondFrac);
              const c = lerpColor(palette.accent, palette.body, smoothstep(ENTER.colorFrom, ENTER.colorTo, secondFrac));
              color = toRgba(c, c[3]);
              blur = MAX_BLUR * (1 - e);
              entering = true;
              growth = e;
            }
          }

          // Far side of a perspective form is dimmer and smaller.
          opacity *= 0.25 + 0.75 * depth;
          if (opacity <= 0.001) continue;
          if (!options.motionBlur) blur = 0;

          const x = mix(target.x, home.x, reach);
          const y = mix(target.y, home.y, reach);

          // String from anchor towards home, stopping short of the label.
          const dx = home.x - anchor.x;
          const dy = home.y - anchor.y;
          const span = Math.hypot(dx, dy);
          if (span > 1) {
            const startPad = form.padAnchor ? Math.min(labelPad, span / 2) : 0;
            const endAt = Math.max(startPad, span - labelPad) / span;
            const startAt = startPad / span;
            const extent = entering ? growth : Math.min(1, reach);
            const ax = anchor.x + dx * startAt;
            const ay = anchor.y + dy * startAt;
            lines.push({
              absSecond,
              ax,
              ay,
              tx: ax + dx * (endAt - startAt) * extent,
              ty: ay + dy * (endAt - startAt) * extent,
              opacity,
              entering,
              slack,
            });
          }
          prev = { x, y };

          if (!options.labels) continue;
          if (post) {
            textItems.push({ text: pad2(s), x, y, opacity, blur, color, depth });
            continue;
          }
          const label = labelFor(absSecond);
          visible.add(absSecond);
          const text = pad2(s);
          if (label.text !== text) {
            label.el.textContent = text;
            label.text = text;
          }
          const scale = depth < 1 ? ` scale(${(0.7 + 0.3 * depth).toFixed(3)})` : "";
          label.el.style.transform = `translate3d(${x.toFixed(2)}px, ${y.toFixed(2)}px, 0) translate(-50%, -50%)${scale}`;
          // Labels on the far side pass behind the readout.
          const layer = depth < 0.5 ? "0" : "";
          if (label.layer !== layer) {
            label.el.style.zIndex = layer;
            label.layer = layer;
          }
          if (label.opacity !== opacity) {
            label.el.style.opacity = String(opacity);
            label.opacity = opacity;
          }
          const roundedBlur = blur > 0.05 ? Math.round(blur * 100) / 100 : 0;
          if (label.blur !== roundedBlur) {
            label.el.style.filter = roundedBlur ? `blur(${roundedBlur}px)` : "";
            label.blur = roundedBlur;
          }
          if (label.color !== color) {
            label.el.style.color = color;
            label.color = color;
          }
        }
      }
    }

    for (const [absSecond, label] of labels) {
      if (!visible.has(absSecond)) {
        label.el.remove();
        labels.delete(absSecond);
      }
    }

    draw(g, lines, now, textItems, readoutPoint);
  }

  function draw(g, lines, now, textItems, readoutPoint) {
    const frameAt = performance.now();
    const dt = lastFrameAt ? Math.min(0.033, (frameAt - lastFrameAt) / 1000) : 1 / 60;
    lastFrameAt = frameAt;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, width, height);

    const [r, gr, b, a] = palette.body;
    const restColor = [r, gr, b, a * 0.25];
    const pulseColor = [r, gr, b, Math.max(restColor[3], a)];
    const pulseAt = (now * options.pulseSpeed) % 1;
    ctx.lineWidth = options.stringWidth;
    ctx.lineCap = "round";

    // Form-specific backdrop, cross-faded while morphing
    const drawBackdrop = (form, alpha) => {
      if (!form.backdrop || alpha <= 0) return;
      form.backdrop(ctx, g, toRgba(restColor, restColor[3] * alpha));
    };
    if (started) {
      const t = morph ? morph.t : 1;
      drawBackdrop(FORMS[options.form], t);
      if (morph) drawBackdrop(FORMS[morph.from], 1 - t);
    }

    const alive = new Set();
    for (const line of lines) {
      alive.add(line.absSecond);
      const { ax, ay, tx, ty } = line;

      let state = strings.get(line.absSecond);
      if (!state) {
        const random = seededRandom(line.absSecond * 7919);
        state = {
          bend: 0,
          velocity: 0,
          prevX: tx,
          prevY: ty,
          seen: false,
          windPhase: random() * Math.PI * 2,
          windPeriod: 5 + random() * 6,
        };
        strings.set(line.absSecond, state);
      }

      // Unit normal of the string (perpendicular to anchor -> tip)
      const len = Math.max(1, Math.hypot(tx - ax, ty - ay));
      const nx = -(ty - ay) / len;
      const ny = (tx - ax) / len;

      if (!reducedMotion) {
        // Tip moving sideways drags the middle behind it.
        if (state.seen) {
          state.bend -= ((tx - state.prevX) * nx + (ty - state.prevY) * ny) * 0.5 * STRING.inertia;
        } else if (line.entering) {
          state.velocity += STRING.pluck * (seededRandom(line.absSecond)() < 0.5 ? -1 : 1);
        }
        state.seen = true;

        const wind = Math.sin((now / state.windPeriod) * Math.PI * 2 + state.windPhase) * options.wind;

        if (pointer.active && options.mouseForce > 0) {
          const dx = tx - ax;
          const dy = ty - ay;
          const along = clamp01(((pointer.x - ax) * dx + (pointer.y - ay) * dy) / (dx * dx + dy * dy || 1));
          const closestX = ax + dx * along;
          const closestY = ay + dy * along;
          const distance = Math.hypot(pointer.x - closestX, pointer.y - closestY);
          if (distance < STRING.mouseRadius) {
            const falloff = (1 - distance / STRING.mouseRadius) ** 1.7 * Math.sin(Math.PI * along);
            const side = Math.sign((pointer.x - closestX) * nx + (pointer.y - closestY) * ny) || 1;
            const speed = Math.min(2.2, 0.4 + Math.hypot(pointer.vx, pointer.vy) * 0.08);
            state.velocity -= side * falloff * options.mouseForce * speed * dt;
          }
        }

        const accel = -options.stiffness * (state.bend - wind) - STRING.damping * state.velocity;
        state.velocity += accel * dt;
        state.bend = clamp(state.bend + state.velocity * dt, -STRING.maxBend, STRING.maxBend);
      }
      state.prevX = tx;
      state.prevY = ty;

      if (!options.strings) continue;

      // `slack` lets a form keep short strings (e.g. dial ticks) from flapping.
      const offset = state.bend * 2 * line.slack;
      const ctrlX = (ax + tx) / 2 + nx * offset;
      const ctrlY = (ay + ty) / 2 + ny * offset;

      if (reducedMotion || !options.pulse) {
        ctx.strokeStyle = toRgba(restColor, restColor[3] * line.opacity);
      } else {
        // A soft highlight travels outward along every string.
        const gradient = ctx.createLinearGradient(ax, ay, tx, ty);
        for (let i = 0; i <= 6; i++) {
          const t = i / 6;
          let d = Math.abs(t - pulseAt);
          d = Math.min(d, 1 - d);
          const glow = smoothstep(STRING.pulseWidth, 0, d) * STRING.pulseAlpha;
          const c = lerpColor(restColor, pulseColor, glow);
          gradient.addColorStop(t, toRgba(c, c[3] * line.opacity));
        }
        ctx.strokeStyle = gradient;
      }

      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.quadraticCurveTo(ctrlX, ctrlY, tx, ty);
      ctx.stroke();
    }

    for (const key of strings.keys()) if (!alive.has(key)) strings.delete(key);
    pointer.vx *= 0.85;
    pointer.vy *= 0.85;

    if (post) {
      drawCanvasText(textItems, readoutPoint);
      post.render(canvas, dt, now);
    }
  }

  const canBlurText = typeof ctx.filter === "string";

  // Fonts only download when DOM text uses them; in canvas mode nothing does,
  // so request them explicitly or the canvas silently falls back.
  const requestedFonts = new Set();
  function ensureFont(font) {
    if (!document.fonts || requestedFonts.has(font)) return;
    requestedFonts.add(font);
    if (!document.fonts.check(font)) document.fonts.load(font).catch(() => {});
  }

  // Labels on the far side of a perspective form go behind the readout, as in the DOM.
  function drawCanvasText(items, readoutPoint) {
    const drawLabels = (list) => {
      ctx.font = `400 ${labelSize}px ${textStyle.labelFamily}`;
      ensureFont(ctx.font);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      for (const item of list) {
        ctx.save();
        ctx.globalAlpha = item.opacity;
        ctx.fillStyle = item.color || toRgba(palette.body, palette.body[3]);
        if (canBlurText && item.blur > 0.05) ctx.filter = `blur(${item.blur.toFixed(2)}px)`;
        ctx.translate(item.x, item.y);
        if (item.depth < 1) ctx.scale(0.7 + 0.3 * item.depth, 0.7 + 0.3 * item.depth);
        ctx.fillText(item.text, 0, 0);
        ctx.restore();
      }
    };
    drawLabels(items.filter((item) => item.depth < 0.5));
    if (options.readout) {
      const readoutFont = `${textStyle.weight} ${READOUT_SIZE * options.scale}px ${textStyle.family}`;
      ensureFont(readoutFont);
      canvasReadoutWidth = canvasReadout.draw(ctx, readoutPoint.x, readoutPoint.y, {
        font: readoutFont,
        size: READOUT_SIZE * options.scale,
        tracking: textStyle.tracking,
        ink: textStyle.ink,
      });
    }
    drawLabels(items.filter((item) => item.depth >= 0.5));
  }

  function setPostProcess(pass) {
    post = pass;
    readPalette();
    canvas.style.visibility = pass ? "hidden" : "";
    measure();
    frame();
  }

  // Loop control: pause when hidden or offscreen
  let running = false;
  let rafId = 0;
  let intervalId = 0;
  const loop = () => {
    if (!running) return;
    frame();
    rafId = requestAnimationFrame(loop);
  };
  function resume() {
    if (running) return;
    running = true;
    if (reducedMotion) {
      frame();
      intervalId = setInterval(frame, 1000);
    } else {
      rafId = requestAnimationFrame(loop);
    }
  }
  function pause() {
    running = false;
    cancelAnimationFrame(rafId);
    clearInterval(intervalId);
  }

  let pageVisible = !document.hidden;
  let onScreen = true;
  const syncRunning = () => (pageVisible && onScreen ? resume() : pause());

  const onPointerMove = (event) => {
    if (event.pointerType !== "mouse" || !running) return;
    const x = event.clientX - rootRect.left;
    const y = event.clientY - rootRect.top;
    if (pointer.active) {
      pointer.vx = x - pointer.x;
      pointer.vy = y - pointer.y;
    }
    pointer.x = x;
    pointer.y = y;
    pointer.active = true;
  };
  const onPointerLeave = () => {
    pointer.active = false;
    pointer.vx = pointer.vy = 0;
  };
  const onVisibility = () => {
    pageVisible = !document.hidden;
    if (pageVisible) readPalette();
    syncRunning();
  };
  // Rect is cached for pointer math; refresh it when the page scrolls.
  const onScroll = () => (rootRect = root.getBoundingClientRect());

  addEventListener("pointermove", onPointerMove);
  document.addEventListener("pointerleave", onPointerLeave);
  document.addEventListener("visibilitychange", onVisibility);
  addEventListener("scroll", onScroll, { passive: true });

  const resizeObserver = new ResizeObserver(() => {
    measure();
    frame();
  });
  resizeObserver.observe(root);

  const intersectionObserver = new IntersectionObserver(([entry]) => {
    onScreen = entry.isIntersecting;
    syncRunning();
  });
  intersectionObserver.observe(root);

  const colorScheme = matchMedia("(prefers-color-scheme: dark)");
  colorScheme.addEventListener("change", readPalette);
  const themeObserver = new MutationObserver(readPalette);
  themeObserver.observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme", "style"] });

  measure();
  document.fonts?.ready.then(measureReadout);
  resume();
  // The embed stays on Saturn, so the readout follows the center without a position transition.

  function set(next) {
    const previous = options;
    options = sanitizeOptions({ ...options, ...next });
    if (options.form !== previous.form) {
      morph = reducedMotion ? null : { from: previous.form, at: performance.now(), t: 0 };
    }
    if (options.scale !== previous.scale || options.readout !== previous.readout) {
      measure();
      requestAnimationFrame(measureReadout);
    }
    if (options.hour12 !== previous.hour12) {
      shownTime = formatTime(new Date());
      readout.build(shownTime, !started && !reducedMotion);
      canvasReadout.build(shownTime, !started && !reducedMotion);
      requestAnimationFrame(measureReadout);
    }
    readPalette();
  }

  function destroy() {
    pause();
    resizeObserver.disconnect();
    intersectionObserver.disconnect();
    themeObserver.disconnect();
    colorScheme.removeEventListener("change", readPalette);
    removeEventListener("pointermove", onPointerMove);
    document.removeEventListener("pointerleave", onPointerLeave);
    document.removeEventListener("visibilitychange", onVisibility);
    removeEventListener("scroll", onScroll);
    root.replaceChildren();
  }

  return {
    start,
    set,
    replay,
    setPostProcess,
    refresh: readPalette,
    destroy,
    get options() {
      return { ...options };
    },
  };
}

// Retro screens: a WebGL post-process for the clock canvas.
// Every style shares one pipeline per frame:
//   source canvas -> persistence (afterglow feedback, chunky virtual pixels)
//                 -> bloom (downsampled separable blur with a bright-pass)
//                 -> composite (style-specific shading of each virtual pixel)
// The pass reads only alpha (how lit a pixel is) and chroma (the accent),
// and takes its colours from the clock's palette via setColors().

const RETRO_STYLES = {
  crt: {
    label: "CRT",
    // Phosphor glows in the accent colour; the newest second burns toward the title colour.
    params: ["pixel", "scanlines", "glow", "afterglow", "curvature", "dither"],
    defaults: { pixel: 1, scanlines: 0.5, glow: 0.6, afterglow: 0.2, curvature: 0.06, dither: true },
  },
  bitmap: {
    label: "1-bit",
    // Two colours only (background and title); greys become dither patterns.
    params: ["pixel", "dither"],
    defaults: { pixel: 1, scanlines: 0, glow: 0, afterglow: 0, curvature: 0, dither: true },
  },
  vfd: {
    label: "VFD",
    // Vacuum fluorescent display: accent glow behind a fine metal mesh.
    params: ["pixel", "glow", "afterglow", "dither"],
    defaults: { pixel: 2, scanlines: 0, glow: 1, afterglow: 0.15, curvature: 0, dither: true },
  },
  dots: {
    label: "Dots",
    // Halftone dot matrix: each pixel is a round dot sized by brightness.
    params: ["pixel", "glow"],
    defaults: { pixel: 1, scanlines: 0, glow: 0.3, afterglow: 0, curvature: 0, dither: false },
  },
};

const STYLE_INDEX = { crt: 0, bitmap: 1, vfd: 2, dots: 3 };
const BLOOM_DOWNSAMPLE = 3;
const BLOOM_SPREAD = 1.6;

const VERTEX = `
attribute vec2 aPos;
varying vec2 vUv;
void main() {
  vUv = aPos * 0.5 + 0.5;
  gl_Position = vec4(aPos, 0.0, 1.0);
}`;

// Feedback: keep the brighter of the new frame and the decayed previous one.
// R = how lit, G = how much accent ("hot"). The small subtraction lets 8-bit
// values actually reach zero instead of sticking at 1/255.
const PERSIST = `
precision mediump float;
varying vec2 vUv;
uniform sampler2D uSource;
uniform sampler2D uPrev;
uniform vec2 uCell;
uniform float uDecay;
uniform float uSharp;

vec2 lit(vec2 uv) {
  vec4 s = texture2D(uSource, uv);
  float chroma = max(max(s.r, s.g), s.b) - min(min(s.r, s.g), s.b);
  // Lift faint strokes so hairlines survive quantization.
  float level = pow(s.a, 0.7);
  return vec2(level, level * smoothstep(0.25, 0.6, chroma));
}

void main() {
  // Max of four taps so 1px hairlines survive the downsample to chunky pixels.
  // Sharp mode (Dots) samples only the cell centre so glyph strokes stay thin.
  vec2 q = uCell * 0.25;
  vec2 now = uSharp > 0.5
    ? lit(vUv)
    : max(max(lit(vUv + vec2(-q.x, -q.y)), lit(vUv + vec2(q.x, -q.y))),
          max(lit(vUv + vec2(-q.x, q.y)), lit(vUv + vec2(q.x, q.y))));
  vec2 prev = texture2D(uPrev, vUv).rg * uDecay - 1.5 / 255.0;
  gl_FragColor = vec4(max(now, prev), 0.0, 1.0);
}`;

// Linear-sampled 5-tap Gaussian (9 effective taps).
const BLUR = `
precision mediump float;
varying vec2 vUv;
uniform sampler2D uTex;
uniform vec2 uStep;
void main() {
  vec4 c = texture2D(uTex, vUv) * 0.227027;
  c += (texture2D(uTex, vUv + uStep * 1.3846) + texture2D(uTex, vUv - uStep * 1.3846)) * 0.316216;
  c += (texture2D(uTex, vUv + uStep * 3.2308) + texture2D(uTex, vUv - uStep * 3.2308)) * 0.070270;
  gl_FragColor = c;
}`;

const COMPOSITE = `
precision mediump float;
varying vec2 vUv;
uniform sampler2D uPersist;
uniform sampler2D uBloom;
uniform vec2 uVirtual;
uniform float uCellPx;
uniform float uStyle;
uniform vec3 uBg;
uniform vec3 uInk;
uniform vec3 uHot;
uniform float uGlow;
uniform float uScan;
uniform float uCurve;
uniform float uDither;
uniform float uTime;
uniform float uLight;

// Recursive ordered-dither (Bayer) thresholds in [0, 1).
float bayer2(vec2 a) { a = floor(a); return fract(a.x / 2.0 + a.y * a.y * 0.75); }
float bayer4(vec2 a) { return bayer2(0.5 * a) * 0.25 + bayer2(a); }
float bayer8(vec2 a) { return bayer4(0.5 * a) * 0.25 + bayer2(a); }

float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }

// Barrel distortion: push points outward the further they are from the centre.
vec2 curve(vec2 uv) {
  uv = uv * 2.0 - 1.0;
  uv += uv * (uv.yx * uv.yx) * uCurve;
  return uv * 0.5 + 0.5;
}

// Quantize to a few levels; dithering turns in-between values into patterns.
float quantize(float value, float steps, float threshold) {
  return clamp(floor(value * steps + threshold) / steps, 0.0, 1.0);
}

void main() {
  vec2 uv = curve(vUv);
  if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) {
    // Bezel outside the curved glass on dark themes; light themes show no frame.
    gl_FragColor = vec4(uBg * mix(0.35, 1.0, uLight), 1.0);
    return;
  }

  vec2 cell = floor(uv * uVirtual);
  vec2 local = fract(uv * uVirtual);
  vec2 lit = texture2D(uPersist, (cell + 0.5) / uVirtual).rg;
  // Bright-pass: very faint halo would only dither into a grey box, so drop it.
  vec2 glow = max(texture2D(uBloom, uv).rg - 0.06, 0.0) * uGlow * 1.25;
  // Exposure: lift everything so the screen reads bright, not murky.
  // On light backgrounds a dithered halo reads as a grey box, so glow counts less there.
  float level = (lit.x + glow.x * mix(1.0, 0.4, uLight)) * 1.3;
  float hot = lit.y + glow.y * 0.6;
  float threshold = uDither > 0.5 ? bayer8(cell) : 0.5;
  vec3 color;

  // Effects modulate how much ink a pixel gets, never the background itself,
  // so light themes stay clean instead of turning striped or grey.
  if (uStyle < 0.5) {
    // CRT phosphor: five intensity levels, scanlines, flicker, vignette, grain.
    float q = quantize(level, 4.0, threshold);
    float scan = 1.0 - uScan * 0.55 * smoothstep(0.45, 0.95, fract(uv.y * uVirtual.y));
    float flicker = 1.0 - 0.02 * (0.5 + 0.5 * sin(uTime * 55.0));
    float amount = q * scan * flicker;
    color = mix(uBg, uInk, amount);
    color = mix(color, uHot, clamp(hot * amount + max(level - 1.0, 0.0), 0.0, 1.0) * 0.85);
    vec2 c = uv * 2.0 - 1.0;
    color *= 1.0 - mix(0.1, 0.0, uLight) * dot(c, c);
    color += (hash(cell + fract(uTime) * 61.0) - 0.5) * 0.012;
  } else if (uStyle < 1.5) {
    // 1-bit: a pixel is either ink or background. Text comes out solid;
    // only faint strokes and glow fall back to dither patterns.
    float on = lit.x > threshold * 0.65 ? 1.0 : 0.0;
    color = mix(uBg, uInk, on);
  } else if (uStyle < 2.5) {
    // VFD: quantized glow plus halo, hot core, dark mesh between cells.
    float q = quantize(level, 3.0, threshold);
    float edge = 0.16;
    float mesh = max(step(local.x, edge), step(local.y, edge));
    float amount = clamp(q + glow.x * 0.35, 0.0, 1.0) * (1.0 - 0.35 * mesh);
    color = mix(uBg, uInk, amount);
    color = mix(color, uHot, clamp(hot * q, 0.0, 1.0) * 0.7 * (1.0 - 0.35 * mesh));
  } else {
    // Dots: halftone disc per cell, radius from brightness; accent dots for the newest second.
    float radius = sqrt(clamp(level, 0.0, 1.0)) * 0.55;
    float aa = 1.0 / max(uCellPx, 1.0);
    // Empty cells draw nothing (otherwise antialiasing leaves a faint centre dot).
    float dot = (1.0 - smoothstep(radius - aa, radius + aa, length(local - 0.5))) * step(0.02, level);
    vec3 ink = mix(uInk, uHot, clamp(hot * 2.0, 0.0, 1.0));
    color = mix(uBg, ink, dot);
    // Fine paper grain per screen pixel (not per cell, which would show a grid).
    color *= 1.0 + (hash(gl_FragCoord.xy) - 0.5) * 0.025;
  }

  gl_FragColor = vec4(color, 1.0);
}`;

function compile(gl, type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
  return shader;
}

function program(gl, fragment) {
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl, gl.VERTEX_SHADER, VERTEX));
  gl.attachShader(prog, compile(gl, gl.FRAGMENT_SHADER, fragment));
  gl.bindAttribLocation(prog, 0, "aPos");
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  const uniforms = {};
  const count = gl.getProgramParameter(prog, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < count; i++) {
    const { name } = gl.getActiveUniform(prog, i);
    uniforms[name] = gl.getUniformLocation(prog, name);
  }
  return { prog, uniforms };
}

function makeTexture(gl, width, height) {
  const texture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  if (width && height) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, width, height, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  return texture;
}

function makeTarget(gl, width, height) {
  const texture = makeTexture(gl, width, height);
  const framebuffer = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  return { texture, framebuffer, width, height };
}

const toUnit = (rgb) => rgb.slice(0, 3).map((v) => v / 255);
const mixRgb = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);

const luminance = ([r, g, b]) => 0.299 * r + 0.587 * g + 0.114 * b;

// Which palette colour plays which role in each style. On light backgrounds a
// bright accent alone has too little contrast, so it is deepened with the ink.
function styleColors(style, { bg, ink, accent }) {
  const light = luminance(bg) > 0.5;
  const glowInk = light ? mixRgb(accent, ink, 0.45) : accent;
  switch (style) {
    case "bitmap":
      return { bg, ink, hot: ink };
    case "vfd":
      return { bg, ink: glowInk, hot: mixRgb(accent, ink, light ? 0.75 : 0.5) };
    case "dots":
      return { bg, ink, hot: light ? glowInk : accent };
    default:
      return { bg, ink: glowInk, hot: ink };
  }
}

/**
 * Creates the retro pass inside `root` (the clock element). Returns null when
 * WebGL is unavailable, so callers can fall back to the plain clock.
 */
function createRetroPass(root, initial = {}) {
  const canvas = document.createElement("canvas");
  canvas.className = "orbit-crt";
  const gl = canvas.getContext("webgl", { alpha: false, antialias: false, premultipliedAlpha: false });
  if (!gl) return null;
  root.appendChild(canvas);

  let settings = { style: "crt", ...RETRO_STYLES.crt.defaults, ...initial };
  let colors = { bg: [0.03, 0.03, 0.03], ink: [1, 0.95, 0.93], accent: [1, 0.34, 0.06] };
  const persist = program(gl, PERSIST);
  const blur = program(gl, BLUR);
  const composite = program(gl, COMPOSITE);

  const quad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  // Nearest sampling keeps fine strokes (e.g. Geist Pixel Line stripes) from
  // bleeding into their gaps when the source is read into virtual pixels.
  const source = makeTexture(gl, 0, 0);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  let targets = null;
  let size = { width: 0, height: 0 };
  let dpr = 1;

  function allocate() {
    const { width, height } = size;
    if (width < 2 || height < 2) return;
    dpr = Math.min(2, devicePixelRatio || 1);
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    const vw = Math.max(1, Math.round(width / settings.pixel));
    const vh = Math.max(1, Math.round(height / settings.pixel));
    const bw = Math.max(1, Math.round(vw / BLOOM_DOWNSAMPLE));
    const bh = Math.max(1, Math.round(vh / BLOOM_DOWNSAMPLE));
    if (targets) {
      for (const target of Object.values(targets).flat()) {
        gl.deleteTexture(target.texture);
        gl.deleteFramebuffer(target.framebuffer);
      }
    }
    targets = {
      persist: [makeTarget(gl, vw, vh), makeTarget(gl, vw, vh)],
      bloom: [makeTarget(gl, bw, bh), makeTarget(gl, bw, bh)],
    };
  }

  function pass(prog, target, bindings) {
    gl.useProgram(prog.prog);
    gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.framebuffer : null);
    gl.viewport(0, 0, target ? target.width : canvas.width, target ? target.height : canvas.height);
    let unit = 0;
    for (const [name, value] of Object.entries(bindings)) {
      const location = prog.uniforms[name];
      if (location === undefined) continue;
      if (value instanceof WebGLTexture) {
        gl.activeTexture(gl.TEXTURE0 + unit);
        gl.bindTexture(gl.TEXTURE_2D, value);
        gl.uniform1i(location, unit++);
      } else if (typeof value === "number") {
        gl.uniform1f(location, value);
      } else if (value.length === 2) {
        gl.uniform2fv(location, value);
      } else {
        gl.uniform3fv(location, value);
      }
    }
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  function render(sourceCanvas, dt, time) {
    if (!targets) return;
    gl.bindTexture(gl.TEXTURE_2D, source);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, sourceCanvas);

    const style = RETRO_STYLES[settings.style] ? settings.style : "crt";
    // Parameters a style does not use stay neutral even if set.
    const uses = (key) => RETRO_STYLES[style].params.includes(key);
    const value = (key) => (uses(key) ? settings[key] : RETRO_STYLES[style].defaults[key]);

    const [read, write] = targets.persist;
    const vw = write.width;
    const vh = write.height;
    // Afterglow 0..1 maps to a phosphor time constant of ~20ms..900ms.
    const tau = 0.02 + value("afterglow") * 0.88;
    pass(persist, write, {
      uSource: source,
      uPrev: read.texture,
      uCell: [1 / vw, 1 / vh],
      uDecay: Math.exp(-dt / tau),
      uSharp: style === "dots" ? 1 : 0,
    });
    targets.persist.reverse();

    const [bloomA, bloomB] = targets.bloom;
    pass(blur, bloomA, { uTex: write.texture, uStep: [BLOOM_SPREAD / vw, 0] });
    pass(blur, bloomB, { uTex: bloomA.texture, uStep: [0, BLOOM_SPREAD / bloomA.height] });

    const roles = styleColors(style, colors);
    pass(composite, null, {
      uPersist: write.texture,
      uBloom: bloomB.texture,
      uVirtual: [vw, vh],
      uCellPx: settings.pixel * dpr,
      uStyle: STYLE_INDEX[style],
      uLight: luminance(roles.bg) > 0.5 ? 1 : 0,
      uBg: roles.bg,
      uInk: roles.ink,
      uHot: roles.hot,
      uGlow: value("glow"),
      uScan: value("scanlines"),
      uCurve: value("curvature"),
      uDither: value("dither") ? 1 : 0,
      uTime: time % 1000,
    });
  }

  return {
    render,
    resize(width, height) {
      size = { width, height };
      allocate();
    },
    set(next) {
      const previousPixel = settings.pixel;
      settings = { ...settings, ...next };
      if (settings.pixel !== previousPixel) allocate();
    },
    // Colours arrive as 0-255 RGB(A) arrays from the clock's palette.
    setColors({ bg, ink, accent }) {
      colors = { bg: toUnit(bg), ink: toUnit(ink), accent: toUnit(accent) };
    },
    destroy() {
      gl.getExtension("WEBGL_lose_context")?.loseContext();
      canvas.remove();
    },
  };
}

/**
 * Switches the retro screen on a mounted clock. Call with settings (including
 * `style`) to turn it on or update it, and with null to turn it off.
 * Returns whether it is on.
 */
function retroController(clock, root) {
  let pass = null;
  return (settings) => {
    if (!settings) {
      if (pass) {
        clock.setPostProcess(null);
        pass.destroy();
        pass = null;
      }
      return false;
    }
    if (pass) {
      pass.set(settings);
      return true;
    }
    pass = createRetroPass(root, settings);
    if (!pass) return false;
    clock.setPostProcess(pass);
    return true;
  };
}

document.documentElement.dataset.theme = location.hash === "#light" ? "light" : "dark";
const root = document.getElementById("clock");
const clock = mountOrbitClock(root, {"form":"saturn","scale":1,"hour12":false,"readout":true,"labels":true,"strings":true,"tick":"eased","collapse":true,"motionBlur":true,"pulse":true,"pulseSpeed":0.8,"wind":18,"mouseForce":2400,"stiffness":140,"stringWidth":0.5});

window.addEventListener("message", (event) => {
  if (event.source !== parent) return;
  if (event.data === "smileo-orbit-clock-reveal") root.setAttribute("data-revealed", "");
  const theme = event.data?.orbitTheme;
  if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
});
document.fonts.ready.then(() => requestAnimationFrame(() => {
  clock.start(false);
  requestAnimationFrame(() => parent.postMessage("smileo-orbit-clock-ready", "*"));
}));
</script>
